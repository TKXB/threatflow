[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextgen-tm-server"
version = "0.1.0"
description = "FastAPI backend for nextgen-tm-frontend"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2",
  "orjson>=3",
  "httpx>=0.27",
  "requests>=2.31",
  "supabase>=2",
  "python-jose[cryptography]>=3.3",
  "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

